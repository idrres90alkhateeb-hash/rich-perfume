<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إتمام الطلب | RICH Perfume</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>

    <a href="/" class="logo">
        RICH
    </a>

    <nav>
        <a href="/">الرئيسية</a>
        <a href="/products">العطور</a>
        <a href="/bundles">البكجات</a>
        <a href="/gifts">الهدايا</a>
        <a href="/cart">السلة 🛒</a>
    </nav>

</header>


<main class="checkout-page">

    <div class="checkout-container">

        <div class="checkout-form">

            <p class="small-title">
                RICH PERFUME
            </p>

            <h1>
                إتمام الطلب
            </h1>

            <p class="checkout-subtitle">
                أدخل بياناتك حتى نتمكن من تجهيز طلبك.
            </p>


            <form method="POST" action="/checkout">

                <div class="form-group">

                    <label for="customer_name">
                        الاسم الكامل
                    </label>

                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        placeholder="مثال: أحمد محمد"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        رقم الهاتف
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="07XXXXXXXX"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        المدينة
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="مثال: عمّان"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        العنوان
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="المنطقة، الشارع، رقم المبنى..."
                        rows="4"
                        required
                    ></textarea>

                </div>


                <button type="submit" class="btn checkout-btn">
                    تأكيد الطلب
                </button>

            </form>

        </div>

    </div>

</main>


<footer>

    <div class="logo">
        RICH
    </div>

    <p>
        RICH Perfume
    </p>

    <p>
        عطور تليق بذوقك
    </p>

</footer>

</body>

</html>
