<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} | RICH Perfume</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>

    <a href="/" class="logo">
        RICH
    </a>

    <nav>
        <a href="/">الرئيسية</a>
        <a href="/products">العطور</a>
        <a href="/bundles">البكجات</a>
        <a href="/gifts">الهدايا</a>
        <a href="/cart">السلة 🛒</a>
    </nav>

</header>


<main class="product-page">

    <!-- صورة المنتج -->

    <div class="product-detail-image">

        <div class="product-placeholder">
            RICH
        </div>

    </div>


    <!-- معلومات المنتج -->

    <div class="product-detail-info">

        <p class="product-category">
            {{ product.category or "عطر" }}
        </p>

        <h1>
            {{ product.name }}
        </h1>

        <p class="product-detail-description">
            {{ product.description }}
        </p>

        <div class="product-detail-price">
            {{ "%.2f"|format(product.price) }} JD
        </div>

        <p class="product-stock">
            متوفر: {{ product.stock }} قطعة
        </p>


        <!-- اختيار الكمية -->

        <form
            action="{{ url_for('add_to_cart', product_id=product.id) }}"
            method="POST"
            class="add-to-cart-form"
        >

            <div class="quantity-box">

                <label for="quantity">
                    الكمية
                </label>

                <div class="quantity-control">

                    <button
                        type="button"
                        onclick="decreaseQuantity()"
                    >
                        −
                    </button>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        value="1"
                        min="1"
                        max="{{ product.stock }}"
                    >

                    <button
                        type="button"
                        onclick="increaseQuantity()"
                    >
                        +
                    </button>

                </div>

            </div>


            <!-- زر الإضافة -->

            <button
                type="submit"
                class="btn"
            >
                أضف للسلة 🛒
            </button>

        </form>

    </div>

</main>


<footer>

    <div class="logo">
        RICH
    </div>

    <p>
        RICH Perfume
    </p>

    <p>
        عطور تليق بذوقك
    </p>

</footer>


<script>

function increaseQuantity() {

    const input = document.getElementById("quantity");

    const max = parseInt(input.max);

    let value = parseInt(input.value) || 1;

    if (value < max) {
        input.value = value + 1;
    }
}


function decreaseQuantity() {

    const input = document.getElementById("quantity");

    let value = parseInt(input.value) || 1;

    if (value > 1) {
        input.value = value - 1;
    }
}

</script>

</body>

</html>
